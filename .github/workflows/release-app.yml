name: Build & Package App

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            package_script: package:win
            artifact_name: build-windows
            artifact_paths: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml
          - name: macOS ARM64
            os: macos-15
            package_script: package:mac
            artifact_name: build-macos-arm64
            artifact_paths: |
              dist/*.dmg
              dist/*.dmg.sha256

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata and tag
        run: node scripts/verify-release.mjs
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Prepare and verify bundled fonts
        run: npm run fonts:prepare && npm run fonts:verify

      - name: Typecheck
        run: npm run typecheck

      - name: Test subtitle engine
        run: npm run test:subtitles

      - name: Test local runtime suite
        run: npm run test:local-runtime

      - name: Build and package Windows app
        if: runner.os == 'Windows'
        run: npm run ${{ matrix.package_script }}

      - name: Build macOS ARM64 DMG for manual installation
        if: runner.os == 'macOS'
        run: npm run ${{ matrix.package_script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify macOS architecture and create checksum
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path="$(find dist -type d -name 'TediaPros.app' -print -quit)"
          test -n "$app_path"
          lipo -archs "$app_path/Contents/MacOS/TediaPros" | grep -qw arm64
          dmg="$(find dist -maxdepth 1 -type f -name 'TediaPros-*-mac-arm64.dmg' -print -quit)"
          test -n "$dmg"
          (cd dist && shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256")

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 7
