name: Build and release app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            package_script: package:win
            artifact_name: build-windows
            artifact_paths: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata and tag
        run: node scripts/verify-release.mjs
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Prepare and verify bundled fonts
        run: npm run fonts:prepare && npm run fonts:verify

      - name: Typecheck
        run: npm run typecheck

      - name: Test subtitle engine
        run: npm run test:subtitles

      - name: Test local runtime suite
        run: npm run test:local-runtime

      - name: Build and package Windows app
        if: runner.os == 'Windows'
        run: npm run ${{ matrix.package_script }}

      - name: Upload branch/tag build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish immutable app release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.1

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify all release assets
        run: node scripts/verify-release-assets.mjs dist --windows-only

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "${{ github.repository }}" --verify-tag --title "TediaPros $TAG" --generate-notes dist/*
