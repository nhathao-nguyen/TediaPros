appId: com.neeyubl.tblao
productName: TediaPros
directories:
  buildResources: build
  output: dist
publish:
  provider: github
  owner: nhathao-nguyen
  repo: TediaPros
  releaseType: release
files:
  # Package only the production bundles.  The old broad default pulled prior
  # dist outputs and local evidence into app.asar, recursively inflating later
  # Windows installers until NSIS could no longer create them.
  - out/**/*
  - package.json
extraResources:
  - from: resources/fonts
    to: fonts
    filter:
      - manifest.json
      - catalog.json
      - README.md
      - licenses/**/*
      - NotoSans.ttf
      - NotoSansArabic.ttf
      - NotoSansThai.ttf
      - NotoSansKR.ttf
win:
  target:
    - nsis
  icon: build/icon.ico
  signAndEditExecutable: false
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  target:
    - target: dmg
      arch:
        - arm64
  icon: build/icon.png
  category: public.app-category.utilities
  minimumSystemVersion: '11.0'
  identity: null
  hardenedRuntime: false
  notarize: false
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
