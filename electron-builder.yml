appId: com.neeyubl.tblao
productName: TediaPros
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!font/**'
  - '!resources/fonts/**'
  # Never package local sessions or credential files, even if copied into the repo.
  - '!cookies{,/**}'
  - '!cookies.txt'
  - '!cookies-*.txt'
  - '!**/*.cookies.json'
  - '!**/Network/Cookies'
  - '!**/Network/Cookies-journal'
  - '!**/.env{,.*}'
  - '!**/*.pem'
  - '!**/*.key'
  # Engine/model and native runtime artifacts are strictly excluded from the installer.
  - '!resources/local-assets{,/**}'
  - '!resources/models{,/**}'
  - '!native{,/**}'
  - '!repo test{,/**}'
  - '!dist-engine{,/**}'
  - '!engines{,/**}'
  - '!**/*.zip'
  - '!**/*.dll'
  - '!**/*.exe'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
  - '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}'
extraResources:
  - from: resources/fonts
    to: fonts
    filter:
      - manifest.json
      - catalog.json
      - README.md
      - licenses/**/*
      - NotoSans.ttf
      - NotoSansArabic.ttf
      - NotoSansThai.ttf
      - NotoSansKR.ttf
win:
  target:
    - nsis
  icon: build/icon.ico
  signAndEditExecutable: false
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  target:
    - target: dmg
      arch:
        - arm64
  icon: build/icon.png
  category: public.app-category.utilities
  minimumSystemVersion: '11.0'
  identity: null
  hardenedRuntime: false
  notarize: false
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
