appId: com.neeyubl.tblao
productName: TediaPros
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!font/**'
  - '!resources/fonts/**'
  # Never package local sessions or credential files, even if copied into the repo.
  - '!cookies{,/**}'
  - '!cookies.txt'
  - '!cookies-*.txt'
  - '!**/*.cookies.json'
  - '!**/Network/Cookies'
  - '!**/Network/Cookies-journal'
  - '!**/.env{,.*}'
  - '!**/*.pem'
  - '!**/*.key'
  # Engine/model chỉ được đóng gói hoặc import từ bundle local đã kiểm tra.
  - '!repo test{,/**}'
  - '!dist-engine{,/**}'
  - '!engines{,/**}'
  - '!**/*.zip'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
  - '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}'
extraResources:
  - from: resources/fonts
    to: fonts
    filter:
      - manifest.json
      - catalog.json
      - README.md
      - licenses/**/*
      - NotoSans.ttf
      - NotoSansArabic.ttf
      - NotoSansThai.ttf
      - NotoSansKR.ttf
  - from: resources/local-assets
    to: local-assets
    filter:
      - manifest.json
      - '**/*'
  - from: resources/models/whisper-cpp
    to: models/whisper-cpp
    filter:
      - '**/*'
win:
  target:
    - nsis
  icon: build/icon.ico
  # This project has no Windows signing certificate. Skipping rcedit/signing
  # avoids Electron Builder's macOS symlink payload on non-admin Windows while
  # retaining the configured NSIS installer icon below.
  signAndEditExecutable: false
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  target:
    - target: dmg
      arch:
        - arm64
  icon: build/icon.png
  category: public.app-category.utilities
  minimumSystemVersion: '11.0'
  # macOS dùng cơ chế thông báo + tải DMG thủ công. Không tạo gói updater tự cài.
  identity: null
  hardenedRuntime: false
  notarize: false
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
# Không cấu hình publish/updater ở đây. Bản local không có runtime update channel.
